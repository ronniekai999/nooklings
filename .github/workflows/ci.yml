name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nooklings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-bundle:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: swift --version
      - name: Build app
        run: swift build
      - name: Run regression tests
        timeout-minutes: 5
        env:
          NOOKLINGS_SNAPSHOT_DIRECTORY: ${{ github.workspace }}/.artifacts/companion-previews
        run: swift test
      - name: Build release app bundle
        env:
          UNIVERSAL: '1'
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./bundle.sh
      - name: Validate bundle metadata
        run: |
          plutil -lint Nooklings.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' Nooklings.app/Contents/Info.plist)" = Nooklings
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Nooklings.app/Contents/Info.plist)" = com.ronnie.byte
          test -x Nooklings.app/Contents/MacOS/Nooklings
          test -s Nooklings.app/Contents/Resources/Nooklings.icns
          lipo Nooklings.app/Contents/MacOS/Nooklings -verify_arch arm64 x86_64
          bash -n scripts/release.sh
      - name: Verify bundled companion artwork
        run: swift scripts/verify-bundle.swift Nooklings.app
      - name: Upload native companion previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-previews
          path: .artifacts/companion-previews/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload native care previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: care-previews
          path: .artifacts/companion-previews/care-normal/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload native reduced-motion care previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: care-previews-reduced-motion
          path: .artifacts/companion-previews/care-reduced-motion/
          if-no-files-found: warn
          retention-days: 7
